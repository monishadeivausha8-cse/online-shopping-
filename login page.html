<!DOCTYPE html>
<html>
<head>

<title>Login Page</title>

<style>

body{
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #74ebd5, #ACB6E5);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box{

    background-color: white;
    padding: 40px;
    width: 350px;
    border-radius: 15px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
    text-align: center;
}

.input-box{
    margin-bottom: 15px;
}

.input-box input{

    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button{

    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background-color: #4A90E2;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover{
    background-color: #357ABD;
}

a{
    text-decoration: none;
    color: #357ABD;
}

p{
    margin-top: 15px;
}

</style>

</head>

<body>

<div class="login-box">

    <h1>Login</h1>

    <form action="products 1.html">
        <div class="input-box">
            <input type="email" placeholder="Enter Email" required>
        </div>

        <div class="input-box">
            <input type="password" placeholder="Enter Password" required>
        </div>

        <button type="submit">Login</button>

    </form>

    <p>
        Don't have an account?
        <a href="register.html">Register</a>
    </p>

</div>

</body>
</html>
