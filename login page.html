<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blush Bay Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),
    url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1400&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
}



.login-container{
    width:90%;
    max-width:420px;
    background:rgba(255,255,255,0.95);
    padding:40px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    animation:fadeIn 1s ease;
}



.logo{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    color:#ff4f81;
    margin-bottom:10px;
    letter-spacing:2px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}



.input-box{
    margin-bottom:20px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    color:#444;
    font-weight:bold;
}

.input-box input{
    width:100%;
    padding:14px;
    border:2px solid #ffd1dc;
    border-radius:12px;
    font-size:16px;
    outline:none;
    transition:0.3s;
}

.input-box input:focus{
    border-color:#ff4f81;
    box-shadow:0 0 10px rgba(255,79,129,0.3);
}

/* Button */

.login-btn{
    width:100%;
    padding:15px;
    background:#ff4f81;
    border:none;
    border-radius:12px;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#e63d70;
    transform:scale(1.02);
}


.register-text{
    text-align:center;
    margin-top:20px;
    color:#555;
}

.register-text a{
    color:#ff4f81;
    text-decoration:none;
    font-weight:bold;
}

.register-text a:hover{
    text-decoration:underline;
}


@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:500px){

    .logo{
        font-size:32px;
    }

}

</style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        Blush Bay
    </div>

    <p class="subtitle">
        Login to explore beautiful home decor products
    </p>

    <form action="product.html">

        <div class="input-box">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="register-text">
        Don’t have an account?
        <a href="register page.html">Register</a>
    </div>

</div>

</body>
</html>
